# Optional: use only in managed environments with CODEX_PROXY_CERT configured.
services:
  app:
    build:
      dockerfile: Dockerfile.proxy
      secrets:
        - proxy_ca
  migrate:
    build:
      dockerfile: Dockerfile.proxy
      secrets:
        - proxy_ca
secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:?Set CODEX_PROXY_CERT to the proxy CA certificate path}
