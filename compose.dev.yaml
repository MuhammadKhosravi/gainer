# Database-only setup for Next.js running on the host.
name: gainer-dev
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gainer
      POSTGRES_USER: gainer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gainer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gainer -d gainer"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  gainer_data:
